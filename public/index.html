<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>🎯 Number Guessing Game</h1>
            <p class="subtitle">I'm thinking of a number between 1 and 50</p>
            
            <div id="game-info" class="game-info">
                <div class="info-item">
                    <span class="label">Attempts Left:</span>
                    <span id="attempts" class="value">5</span>
                </div>
            </div>
            
            <div id="game-area" class="game-area">
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guess-input" 
                        placeholder="Enter your guess (1-50)" 
                        min="1" 
                        max="50"
                        disabled
                    >
                    <button id="guess-button" onclick="makeGuess()" disabled>Guess</button>
                </div>
                
                <div id="message" class="message"></div>
                
                <div id="guess-history" class="guess-history">
                    <h3>Your Guesses:</h3>
                    <div id="history-items" class="history-items"></div>
                </div>
            </div>
            
            <div class="actions">
                <button id="new-game-button" class="new-game-btn" onclick="startNewGame()">
                    Start New Game
                </button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
